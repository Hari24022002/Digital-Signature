<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}📜e-HASTAKSHAR{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body {
      background: url("{{ url_for('static', filename='images/LCH.jpg') }}") no-repeat center center fixed;
      background-size: cover;
      font-family: 'Inter', sans-serif;
      color: white;
    }

    .content-wrapper {
      background-color: rgba(41, 42, 43, 0.301); /* semi-transparent black */
      min-height: 40vh;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 15px 32px rgba(105, 105, 105, 0.6);
    }

    .alert {
      color: #fff;
      background-color: rgba(245, 44, 44, 0.199);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 10px;
      border-radius: 8px;
    }

    /* Highlighted Title Styles */
    .title-highlight {
      background: linear-gradient(45deg, #fbfafc, #f5f7f8); /* Blue gradient */
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-style: italic;
      font-weight: 900;
      font-size: 0.8em; /* Slightly larger than surrounding text */
      text-shadow: 0 0 10px rgba(12, 12, 12, 0.384); /* Subtle glow */
      animation: glow 2s ease-in-out infinite alternate;
      display: inline-block; /* Ensures gradient and shadow apply correctly */
    }


    /* Ensure title remains readable in dark mode */
    body.dark .title-highlight {
      background: linear-gradient(45deg, #f7fcfb, #f8f9fa); /* Adjusted gradient for dark mode */
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 10px rgba(10, 10, 10, 0.897);
    }
  </style>
</head>
<body>
  <div class="container content-wrapper">
    <h1 class="text-center">📄 Welcome to <span class="title-highlight">e-HASTAKSHAR</span></h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="mt-3">
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>

  <div class="toggle-switch" style="position: fixed; top: 20px; right: 20px;">
    <input type="checkbox" id="darkToggle" />
    <label for="darkToggle">🌙</label>
  </div>

  <script>
    const toggle = document.getElementById("darkToggle");
    toggle.addEventListener("change", () => {
      document.body.classList.toggle("dark");
      localStorage.setItem("dark", document.body.classList.contains("dark"));
    });
    window.addEventListener("DOMContentLoaded", () => {
      if (localStorage.getItem("dark") === "true") {
        document.body.classList.add("dark");
        toggle.checked = true;
      }
    });
  </script>
</body>
</html>
